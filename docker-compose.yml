services:
  mongodb:
    image: mongo:7.0
    container_name: anticamera_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=anticamera_db
    volumes:
      - mongodb_data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: anticamera_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  mongodb_data:
    driver: local
  mosquitto_data:
    driver: local

