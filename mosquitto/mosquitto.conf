# Mosquitto MQTT Broker Configuration
# For local development of Hybrid Anti-Camera Detection System

# Standard MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (useful for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections for local development
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
